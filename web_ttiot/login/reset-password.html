<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - HCMUTE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-logo">
        <img src="logo.png" alt="HCMUTE Logo">
        <div class="header-text">
            <div class="title-vi">TRƯỜNG ĐẠI HỌC CÔNG NGHỆ KỸ THUẬT</div>
            <div class="title-en">TP.HCM</div>
        </div>
    </div>

    <div class="container">
        <div class="form-section">
            <h1 class="main-title">Trạm quang trắc thời tiết</h1>
            <h2 class="sub-title">THIẾT LẬP MẬT KHẨU MỚI</h2>
            
            <form id="newPasswordForm">
                <div class="input-group">
                    <input type="password" id="newPass" placeholder="Nhập mật khẩu mới (từ 6 ký tự)" required>
                </div>
                <div class="input-group">
                    <input type="password" id="confirmPass" placeholder="Xác nhận lại mật khẩu mới" required>
                </div>
                
                <button type="submit" id="btnConfirmReset" class="btn-primary">Cập nhật mật khẩu</button>

                <div style="margin-top: 20px;">
                    <a href="login.html" class="forgot-pass" style="text-align: center; display: block;">Quay lại đăng nhập</a>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // Cấu hình Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCEZa07j4UMaaHLhboLotGh8IFCs3bOciM",
            authDomain: "aiotnhom2-80e7a.firebaseapp.com",
            projectId: "aiotnhom2-80e7a",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Lấy mã oobCode ẩn trên thanh địa chỉ URL do email Firebase đính kèm vào
        const urlParams = new URLSearchParams(window.location.search);
        const oobCode = urlParams.get('oobCode');

        // Nếu ai đó tự gõ trực tiếp link reset-password.html mà không có mã từ email
        if (!oobCode) {
            alert("Đường dẫn không hợp lệ hoặc đã hết hạn!");
            document.getElementById("newPasswordForm").style.display = "none";
        }

        // Xử lý gửi mật khẩu mới lên Firebase
        document.getElementById('newPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPass = document.getElementById('newPass').value;
            const confirmPass = document.getElementById('confirmPass').value;

            if (newPass.length < 6) {
                alert("Mật khẩu phải từ 6 ký tự trở lên!"); return;
            }
            if (newPass !== confirmPass) {
                alert("Mật khẩu xác nhận không khớp!"); return;
            }

            try {
                const btn = document.getElementById('btnConfirmReset');
                btn.disabled = true;
                btn.innerText = "Đang xử lý...";
                btn.classList.add('btn-disabled');

                // Lệnh ghi đè mật khẩu của Firebase
                await confirmPasswordReset(auth, oobCode, newPass);
                
                alert("Đổi mật khẩu thành công! Bạn có thể đăng nhập bằng mật khẩu mới ngay bây giờ.");
                window.location.href = "login.html"; // Quay về trang đăng nhập
                
            } catch (error) {
                console.error(error);
                alert("Lỗi: " + error.message + " (Có thể liên kết đổi mật khẩu đã quá hạn)");
                const btn = document.getElementById('btnConfirmReset');
                btn.disabled = false;
                btn.innerText = "Cập nhật mật khẩu";
                btn.classList.remove('btn-disabled');
            }
        });
    </script>
</body>
</html>
